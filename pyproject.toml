[project]
name = "mysoundprint"
version = "0.1.0"
description = "Personal listening statistics API built on top of the Spotify Web API."
authors = [
    {name = "Lucas de Oliveira Pimentel",email = "lucasoliveirapimentel.dev@gmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=8.1.0,<9.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "tzdata (>=2026.5,<2027.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.ruff]
# Pinned explicitly rather than left to the default, which changes between
# ruff releases and would turn a dependency bump into a failing pipeline.
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "RUF",  # ruff's own
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is a call in a default argument, which is
# exactly what B008 exists to catch. The pattern is deliberate here, so the
# callables are declared immutable rather than the rule switched off.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.security.HTTPBearer",
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these, and it does not wrap. Everything else still applies.
"alembic/versions/*" = ["E501"]
